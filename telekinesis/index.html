<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Christian Devalcoeur — telekinesis</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f7f3ed;font-family:system-ui,Segoe UI,sans-serif}.shell{min-height:100svh;display:grid;grid-template-columns:1fr 1fr}.art{background:linear-gradient(0deg,#090b12aa,transparent 55%),url('../assets/telekinesis.webp') center 25%/cover no-repeat;min-height:100svh}.info{display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,7vw,110px);gap:25px;background:radial-gradient(circle at 80% 20%,#34233d80,transparent 48%),#090b12}.brand{color:#dabc7c;letter-spacing:.2em;font-size:13px}h1{font:normal clamp(37px,4.2vw,74px)/1.1 Georgia,serif;margin:0}.description{font-size:17px;color:#b3b7c6;max-width:440px;line-height:1.7}.cta,.back{align-self:flex-start;color:#fff;text-decoration:none;padding:14px 21px;border:1px solid #bc9f63;transition:background .2s}.cta:hover,.back:hover{background:#46391b}.back{border-color:#4b4b5b;color:#ccc;padding:10px 16px}.langs{display:flex;gap:10px}.langs button{color:#d0c5af;border:1px solid #4b4b5b;background:none;padding:7px 12px;cursor:pointer}.langs button.active{border-color:#dabc7c;color:#dabc7c}.pending{border-left:2px solid #dabc7c;padding-left:20px;color:#bdc3cf}@media(max-width:780px){.shell{grid-template-columns:1fr}.art{min-height:38svh}.info{min-height:62svh;padding:28px}}
</style></head><body><div class="shell"><div class="art" role="img" aria-label="Christian Devalcoeur"></div><main class="info"><span class="brand">CHRISTIAN DEVALCOEUR</span><div class="langs"><button data-lang="ru">RU</button><button data-lang="en">EN</button><button data-lang="fr">FR</button></div><h1 id="title"></h1><p class="description" id="description"></p><a class="cta" id="external" href="https://telekinezshow.ru/" rel="noopener noreferrer">Open dedicated website ↗</a><a class="back" id="back" href="../">← На главную</a></main></div><script>
const STRINGS={"ru": {"back": "← На главную", "open": "Открыть отдельный сайт", "soon": "Этот раздел готовится. Позже здесь появится ссылка на отдельный сайт.", "host": "Ведущий и шоумен", "actor": "Актёр", "ai": "AI Creator", "telekinesis": "Telekinesis Show", "hostnote": "Переход к ранее созданному портфолио ведущего.", "telenote": "Перейти на отдельный сайт Telekinesis Show."}, "en": {"back": "← Back to portal", "open": "Open dedicated website", "soon": "This section is being prepared. A link to its dedicated website will appear here.", "host": "Host & Showman", "actor": "Actor", "ai": "AI Creator", "telekinesis": "Telekinesis Show", "hostnote": "Visit the existing host and showman portfolio.", "telenote": "Visit the dedicated Telekinesis Show website."}, "fr": {"back": "← Retour au portail", "open": "Ouvrir le site dédié", "soon": "Cette rubrique est en préparation. Le lien vers son site dédié apparaîtra ici.", "host": "Animateur & Showman", "actor": "Acteur", "ai": "Créateur IA", "telekinesis": "Telekinesis Show", "hostnote": "Accéder au portfolio de l’animateur.", "telenote": "Accéder au site dédié de Telekinesis Show."}};const section="telekinesis";let lang=new URLSearchParams(location.search).get('lang');if(!STRINGS[lang]){try{lang=localStorage.getItem('portal-lang')}catch(e){}}if(!STRINGS[lang])lang='ru';
function render(l){lang=l;document.documentElement.lang=l;try{localStorage.setItem('portal-lang',l)}catch(e){}const t=STRINGS[l];document.getElementById('title').textContent=t[section];document.getElementById('description').textContent=section==='host'?t.hostnote:section==='telekinesis'?t.telenote:t.soon;const ex=document.getElementById('external');if(ex)ex.textContent=t.open+' ↗';const pending=document.getElementById('pending');if(pending)pending.textContent=t.soon;document.getElementById('back').textContent=t.back;document.getElementById('back').href='../index.html?lang='+l;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));document.title='Christian Devalcoeur — '+t[section]}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.lang)));render(lang);
</script></body></html>
